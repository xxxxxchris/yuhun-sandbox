<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="阴阳师御魂沙盒：6 星御魂随便买、随便强化，召唤按公示概率和保底模拟。玩家自制的非官方工具，数据取自游戏客户端配置表。">
<title>御魂沙盒</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
<style>
/* 布局：桌面左栏「买 + 强化台」固定，右栏是仓库网格；手机上按 买 → 强化台 → 仓库 竖排。色调沿用本仓库网页的「靛纸 + 墨 + 朱 / 群青 / 金」，
   御魂按副属性条数用游戏里的 灰/绿/蓝/紫/橙 五档（ghost_rune/BTN_FW_* 边框的顺序） */
:root {
  --bg: #eef0f4;
  --fg: #1b1e2c;
  --muted: #5b617a;
  --surface: #ffffff;
  --surface-2: #e4e7ef;
  --line: #cdd2de;
  --red: #c4372c;
  --red-soft: #f6dcd8;
  --blue: #2e6db0;
  --blue-soft: #d9e6f5;
  --gold: #b7860f;
  --gold-soft: #f3e6bf;
  --t0: #8a8f9e;
  --t1: #3d8a57;
  --t2: #2e6db0;
  --t3: #7a4cb0;
  --t4: #c26a12;
  --on-tier: #ffffff;
  --r-r: #6f7890;
  --r-sr: #2e6db0;
  --r-ssr: #b7860f;
  --r-sp: #c4372c;
  --r-ur: #8a3fb8;
  --chart-1: #2e6db0;   /* 统计图的「实际」：浅色 #2e6db0、深色 #5794d9，都过了 dataviz 的配色校验（亮度带、对比度） */
  --chart-dist: #8d95a8; /* 抽卡统计里「所有人」的分布（中性灰，对底色 3:1）：深色 #6f7890 */
  --font-display: "ZCOOL XiaoWei", "STKaiti", "KaiTi", "Kaiti SC", "Noto Serif SC", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161f; --fg: #e8e6de; --muted: #9aa0b6; --surface: #1c2030; --surface-2: #262b3d; --line: #343a50;
    --red: #e2574c; --red-soft: #4a2622; --blue: #5e9be0; --blue-soft: #1f3450; --gold: #e0b24a; --gold-soft: #4a3b14;
    --t0: #8d93a8; --t1: #5cb87d; --t2: #5e9be0; --t3: #a983e6; --t4: #ec9a48; --on-tier: #11141c;
    --r-r: #9aa3ba; --r-sr: #5e9be0; --r-ssr: #e0b24a; --r-sp: #e2574c; --r-ur: #b77be6;
    --chart-1: #5794d9; --chart-dist: #6f7890;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chart-1: #5794d9; --chart-dist: #6f7890;
  --bg: #13161f; --fg: #e8e6de; --muted: #9aa0b6; --surface: #1c2030; --surface-2: #262b3d; --line: #343a50;
  --red: #e2574c; --red-soft: #4a2622; --blue: #5e9be0; --blue-soft: #1f3450; --gold: #e0b24a; --gold-soft: #4a3b14;
  --t0: #8d93a8; --t1: #5cb87d; --t2: #5e9be0; --t3: #a983e6; --t4: #ec9a48; --on-tier: #11141c;
  --r-r: #9aa3ba; --r-sr: #5e9be0; --r-ssr: #e0b24a; --r-sp: #e2574c; --r-ur: #b77be6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 56px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- 头部 ---------- */
header { display: grid; gap: 6px; }
header .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); letter-spacing: .06em; margin: 0; line-height: 1.15; }
header p { margin: 0; color: var(--muted); max-width: 70ch; }
.src { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.tabs { display: flex; gap: 6px; padding-block: 14px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* ---------- 通用部件 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.panel > h2, .panel-h h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; letter-spacing: .03em; }
.panel-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 10px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
select, input[type=number], input[type=text], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
select { width: 100%; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; min-width: 36px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg button:disabled { opacity: .45; cursor: default; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; }
.btn:hover:not(:disabled) { border-color: var(--fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; letter-spacing: .1em; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--red); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--line)); }
.btn.small { padding: 3px 10px; font-size: 13px; border-radius: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.tiles { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; }
.tile { display: grid; }
.tile b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
.tile span { font-size: 12px; color: var(--muted); }
.tile small { font-size: 12px; color: var(--muted); }

/* ---------- 御魂页布局 ---------- */
.yh-layout { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 14px; }
.yh-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#store { align-self: start; }
#bench { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - 20px); overflow-y: auto; scrollbar-width: thin; }
@media (max-width: 900px) {
  .yh-layout { grid-template-columns: minmax(0, 1fr); }
  #bench { position: static; max-height: none; overflow: visible; }
}
.buy { display: grid; gap: 10px; }
.buy .go { display: flex; gap: 10px; align-items: center; }
.buy .go .btn.primary { flex: 1; font-size: 17px; padding-block: 9px; }

/* 位置徽章：六边形，按副属性条数上色 */
.hex { --tier: var(--t0); flex: 0 0 auto; width: 28px; height: 32px; display: grid; place-items: center; background: var(--tier); color: var(--on-tier);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font-family: var(--font-display); font-size: 15px; line-height: 1; }
.t0 { --tier: var(--t0); } .t1 { --tier: var(--t1); } .t2 { --tier: var(--t2); } .t3 { --tier: var(--t3); } .t4 { --tier: var(--t4); }
.hex.big { width: 46px; height: 52px; font-size: 24px; }
.tier-name { font-size: 12px; color: var(--tier); font-weight: 700; letter-spacing: .08em; }

/* 强化台 */
.bench-empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.bench-head { display: flex; gap: 12px; align-items: center; }
.bench-head .nm { display: grid; min-width: 0; }
.bench-head .nm b { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.bench-head .lvl { margin-left: auto; font-family: var(--font-mono); font-size: 26px; font-weight: 600; }
.mainline { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px 6px; border-bottom: 1px dashed var(--line); margin-top: 8px; }
.mainline span { color: var(--muted); }
.mainline b { font-family: var(--font-mono); font-size: 20px; }
.sublist { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.sublist li { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 4px; border-radius: 6px; }
.sublist li .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.sublist li.hit { animation: hit 1.1s ease-out; }
@keyframes hit { 0% { background: var(--gold-soft); } 100% { background: transparent; } }
.pips { display: flex; gap: 3px; flex-wrap: wrap; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line); display: block; }
.pips i.on { background: var(--tier); border-color: var(--tier); }
.coefs { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); margin-top: -2px; }
.coefs .nexthit { color: var(--blue); }
.nextnote { margin-top: 6px; }
.lvbar { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; margin: 12px 0 4px; }
.lvbar i { height: 8px; border-radius: 2px; background: var(--surface-2); display: block; }
.lvbar i.on { background: var(--gold); }
.lvbar i.mark { height: 12px; margin-top: -2px; }
.lvlabels { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11px; color: var(--muted); text-align: right; font-family: var(--font-mono); }
.bench-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.bench-actions .grow { flex: 1 1 auto; }
.cost { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.log { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 2px; font-size: 12.5px; }
.log li { display: flex; gap: 8px; }
.log li .num { color: var(--muted); min-width: 2.6em; }
.log .new { color: var(--blue); }
.setfx { font-size: 12.5px; color: var(--muted); margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.setfx b { color: var(--fg); font-weight: 500; }
.float { position: fixed; pointer-events: none; z-index: 20; font-family: var(--font-mono); font-weight: 700; color: var(--gold); animation: up 1.2s ease-out forwards; }
@keyframes up { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }

/* 仓库 */
.store-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 10px; margin-bottom: 10px; }
.store-tools .wide { grid-column: 1 / -1; }
.store-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.store-meta .count { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 8px; }
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; } .yh { padding: 7px 7px 6px; } .yh ul, .yh .mn { font-size: 12px; } }
.yh { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px 7px; display: grid; gap: 4px; min-width: 0; }
.yh:hover { border-color: var(--muted); }
.yh[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.yh.multi[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); background: color-mix(in srgb, var(--blue) 8%, var(--surface)); }
.tick { flex: 0 0 auto; width: 16px; height: 16px; border: 1.5px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 11px; line-height: 1; color: #fff; }
.yh.picked .tick { background: var(--blue); border-color: var(--blue); }
.selbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 5; display: grid; gap: 6px; padding: 9px 10px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--blue); border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .08); }
.selbar .row { gap: 6px 8px; }
.selbar select { width: auto; }
.selbar .chk { white-space: nowrap; }
.yh .hd { display: flex; align-items: center; gap: 7px; min-width: 0; }
.yh .hd b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.yh .hd .lv { margin-left: auto; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.yh .mn { font-size: 12.5px; display: flex; justify-content: space-between; color: var(--muted); }
.yh .mn b { color: var(--fg); font-family: var(--font-mono); font-weight: 600; }
.yh .fx { font-size: 12px; display: flex; justify-content: space-between; color: var(--red); border-bottom: 1px dashed var(--line); padding-bottom: 2px; }
.yh .fx b { font-weight: 600; }
.fxline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 2px; border-bottom: 1px dashed var(--line); font-size: 13px; }
.fxline span { color: var(--muted); }
.fxline b { color: var(--red); font-family: var(--font-mono); font-size: 16px; }
.yh ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: 12.5px; }
.yh li { display: flex; justify-content: space-between; gap: 6px; }
.yh li .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.yh li.hi .v { color: var(--gold); font-weight: 600; }
/* 成长次数「+N」和这一次强化的标记 */
.gr { font-style: normal; font-family: var(--font-mono); font-weight: 600; font-size: .92em; color: var(--blue); margin-left: 3px; }
.mk { font-style: normal; font-size: 10.5px; font-weight: 700; color: #1b1408; background: var(--gold); border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
.yh li.up, .sublist li.up { background: var(--gold-soft); border-radius: 4px; }
.yh li.up { margin-inline: -3px; padding-inline: 3px; }
.sublist li .nm2 { white-space: nowrap; }
.yh .ft { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); min-height: 1.3em; }
.badge { font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); }
.badge.lock { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.badge.new { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); }
.more { display: flex; justify-content: center; padding-top: 12px; }
.empty { color: var(--muted); padding: 30px 8px; text-align: center; }
.confirm { display: inline-flex; gap: 6px; align-items: center; }
.records { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.records button { border: 0; background: none; padding: 0; color: var(--fg); text-decoration: underline dotted; text-underline-offset: 3px; font-family: var(--font-mono); }
.savebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.savebar .hint { flex: 1 1 260px; }
.importbox { display: grid; gap: 6px; margin-top: 8px; }
.importbox textarea { width: 100%; min-height: 80px; font-family: var(--font-mono); font-size: 12px; }

/* 提示条 */
.toasts { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); display: grid; gap: 6px; z-index: 30; width: min(92vw, 460px); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.18); animation: tin .25s ease-out; }
.toast.gold { background: var(--gold); color: #1b1408; font-weight: 700; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 召唤页 ---------- */
.g-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 14px; align-items: start; }
@media (max-width: 900px) { .g-layout { grid-template-columns: minmax(0, 1fr); } }
.g-main { display: grid; gap: 12px; }
.g-opts { display: grid; gap: 10px; }
.g-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.g-actions .btn.primary { min-width: 120px; }
.g-status { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 10px 2px; border-block: 1px dashed var(--line); }
.cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { --rc: var(--r-r); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 3px; min-height: 84px; background: var(--surface); min-width: 0; animation: tin .3s ease-out both; }
.card .rar { font-family: var(--font-mono); font-weight: 600; font-size: 12px; color: var(--rc); letter-spacing: .04em; }
.card .who { font-size: 14.5px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
.card .tags { display: flex; flex-wrap: wrap; gap: 3px; }
.card .line { font-size: 11px; color: var(--muted); line-height: 1.35; }
.card.R { --rc: var(--r-r); } .card.SR { --rc: var(--r-sr); }
.card.SSR, .card.SP, .card.UR { border-color: var(--rc); box-shadow: inset 0 0 0 1px var(--rc); }
.card.SSR { --rc: var(--r-ssr); background: color-mix(in srgb, var(--r-ssr) 9%, var(--surface)); }
.card.SP { --rc: var(--r-sp); background: color-mix(in srgb, var(--r-sp) 8%, var(--surface)); }
.card.UR { --rc: var(--r-ur); background: color-mix(in srgb, var(--r-ur) 10%, var(--surface)); }
.card.R .who, .card.SR .who { color: var(--muted); font-size: 13px; }
.tag { font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); color: var(--fg); }
.tag.up { background: var(--gold); color: #1b1408; }
.tag.pity { background: var(--blue-soft); color: var(--fg); }
.g-side { display: grid; gap: 14px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 340px; overflow-y: auto; font-size: 13px; }
.hist li { display: grid; grid-template-columns: 4.2em 2.8em 1fr; gap: 6px; }
.hist li .n { font-family: var(--font-mono); color: var(--muted); text-align: right; }
.hist li .r { font-family: var(--font-mono); font-weight: 600; }
.coll { display: flex; flex-wrap: wrap; gap: 4px; max-height: 300px; overflow-y: auto; }
.coll span { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.coll span.SSR { border-color: var(--r-ssr); } .coll span.SP { border-color: var(--r-sp); } .coll span.UR { border-color: var(--r-ur); }
.coll span em { font-style: normal; color: var(--muted); font-family: var(--font-mono); margin-left: 3px; }
.miles { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; }
.miles li { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: 8px; color: var(--muted); }
.curvebox { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.curvebox .hint { margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chips span { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.chips span em { font-style: normal; color: var(--muted); margin-right: 4px; }
.miles li.done { color: var(--fg); }
.miles li.done .num::after { content: " ✓"; color: var(--gold); }
.sim { font-size: 13px; }
.curve { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.curve td, .curve th { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: right; font-family: var(--font-mono); font-weight: 400; }
.curve th { text-align: left; color: var(--muted); font-family: var(--font-body); }
.curve tr.now td { color: var(--gold); font-weight: 600; }

/* ---------- 规则页 ---------- */
.rules { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); align-items: start; }
.rules h3 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 6px; }
.rules p, .rules li { color: var(--fg); max-width: 72ch; }
.rules ul { padding-left: 1.2em; margin: 6px 0; }
.rules .muted { color: var(--muted); }
.tblwrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
table.t th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.t td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
code { font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); border-radius: 4px; padding: 0 4px; }

/* ---------- 自定义御魂 ---------- */
.cdlg { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(760px, calc(100vw - 32px));
  max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
.cdlg::backdrop { background: rgba(10, 12, 20, .5); }
.cdlg-body { display: grid; gap: 12px; padding: 16px 16px 0; }
.cd-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cd-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; letter-spacing: .03em; }
.cdlg h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 4px 0 -4px; }
.cd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 10px; }
.cd-rows { display: grid; gap: 8px; }
.cd-row { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) minmax(0, 9.5em); gap: 2px 8px; align-items: center; }
.cd-row .cd-idx { font-family: var(--font-mono); color: var(--muted); text-align: right; }
.cd-row input { width: 100%; }
.cd-row .cd-range { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); }
.cd-row .cd-range.bad { color: var(--red); }
.cdlg input.bad { border-color: var(--red); color: var(--red); }
.cd-prev { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px; background: var(--surface-2); border-radius: 10px; }
.cd-pside { display: grid; gap: 8px; justify-items: start; }
.cd-foot { position: sticky; bottom: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0 16px; background: var(--surface); border-top: 1px solid var(--line); }
.cd-foot .btn.primary { flex: 1 1 160px; }
.cd-n { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.cd-n > span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.cd-n label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.cd-n input { width: 7.5em; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cd-n .hint.bad { color: var(--red); }
@media (max-width: 560px) {
  .cdlg { width: 100vw; max-width: 100vw; height: 100vh; height: 100dvh; max-height: none; margin: 0; border: 0; border-radius: 0; }
  .cd-prev { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- 套装搜索 ---------- */
.setq { width: 100%; }
.setq-n { min-height: 1.1em; font-size: 11.5px; }
.setq-n.bad { color: var(--red); }
.cd-set { grid-column: span 2; }
@media (max-width: 560px) { .cd-set { grid-column: auto; } }

/* ---------- 批量强化统计 ---------- */
.rp-tiles { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.rp-tile { display: grid; }
.rp-tile b { font-size: 20px; font-weight: 600; line-height: 1.3; }
.rp-tile span { font-size: 12px; color: var(--muted); }
.rp-luck { margin: 0; font-size: 13.5px; }
.rp-luck .luck { padding: 0 6px; border-radius: 4px; background: var(--surface-2); }
.rp-luck .luck.up { background: var(--gold-soft); }
.rp-luck .luck.down { background: var(--blue-soft); }
.rp-sec { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.rp-sec h3 { margin: 0; }
.rp-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin: 0; }
.rp-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--chart-1); vertical-align: -1px; margin-right: 5px; }
.rp-legend .ln { display: inline-block; width: 14px; height: 2px; background: var(--fg); vertical-align: 3px; margin-right: 5px; }
.vchart { display: grid; gap: 4px; }
.vc-plot { position: relative; height: 150px; margin-top: 20px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.vc-col { position: relative; height: 100%; border-radius: 6px; }
.vc-col:hover, .vc-col:focus-visible { background: color-mix(in srgb, var(--chart-1) 7%, transparent); }
.vc-bar { position: absolute; bottom: 0; left: 50%; width: min(24px, 55%); transform: translateX(-50%); background: var(--chart-1); border-radius: 4px 4px 0 0; }
.vc-exp { position: absolute; left: 50%; width: min(36px, 80%); height: 2px; transform: translate(-50%, 1px); background: var(--fg); }
.vc-cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 11.5px; color: var(--muted); transform: translateY(-3px); white-space: nowrap; }
.vc-x { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); text-align: center; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.hchart { display: grid; gap: 3px; }
.hc-row { display: grid; grid-template-columns: 5em minmax(0, 1fr) 4.5em; gap: 8px; align-items: center; font-size: 12.5px; border-radius: 4px; }
.hc-row:hover, .hc-row:focus-visible { background: color-mix(in srgb, var(--chart-1) 7%, transparent); }
.hc-lab { white-space: nowrap; }
.hc-track { position: relative; height: 18px; }
.hc-bar { position: absolute; left: 0; top: 3px; height: 12px; background: var(--chart-1); border-radius: 0 4px 4px 0; }
.hc-exp { position: absolute; top: 0; width: 2px; height: 18px; background: var(--fg); transform: translateX(-1px); }
.hc-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.rp-table summary { cursor: pointer; font-size: 12.5px; color: var(--muted); width: max-content; }
.rp-table table { margin-top: 4px; }
.rp-top { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.rp-auto { padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.rtip { position: fixed; z-index: 40; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; line-height: 1.5; white-space: pre-line; max-width: 240px; box-shadow: 0 6px 20px rgba(0, 0, 0, .22); }
.btn.chip { border-color: var(--blue); color: var(--blue); }

/* ---------- 抽卡统计 ---------- */
.vc-bar.dist { background: var(--chart-dist); width: min(22px, 70%); }
.vc-you { position: absolute; top: -16px; bottom: 0; width: 2px; margin-left: -1px; background: var(--chart-1); pointer-events: none; }
.vc-you > span { position: absolute; top: -3px; left: 6px; font-size: 11.5px; line-height: 1.2; color: var(--fg); white-space: nowrap; }
.vc-you.flip > span { left: auto; right: 6px; }
.dchart .vc-x span { overflow: visible; white-space: nowrap; }
.rp-legend .sw.dist { background: var(--chart-dist); }
.rp-legend .ln.you, .rp-legend .ln.tk { width: 2px; height: 12px; background: var(--chart-1); vertical-align: -2px; }
.rp-legend .ln.tk.ink { background: var(--fg); }
.rp-legend .ring { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--chart-1); border-radius: 50%; vertical-align: -1px; margin-right: 5px; box-sizing: border-box; }
.tl { position: relative; height: 58px; margin: 18px 6px 0; border-bottom: 1px solid var(--line); }
.tl-t { position: absolute; bottom: 0; width: 10px; margin-left: -5px; height: 60%; }
.tl-t::before { content: ''; position: absolute; left: 4px; bottom: 0; width: 2px; height: 100%; background: var(--chart-1); border-radius: 1px 1px 0 0; }
.tl-t.ur { height: 76%; }
.tl-t.ur::after { content: ''; position: absolute; left: 1px; top: -8px; width: 8px; height: 8px; border: 2px solid var(--chart-1); border-radius: 50%; box-sizing: border-box; background: var(--surface); }
.tl-t.up { height: 100%; z-index: 1; }
.tl-t.up::before { background: var(--fg); }
.tl-t.up > span { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -2px); font-size: 11.5px; color: var(--fg); white-space: nowrap; }
.tl-t:hover::before { left: 3px; width: 4px; }
.tl-x { display: flex; justify-content: space-between; margin: 3px 6px 0; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<body>


<div class="wrap">
  <header>
    <div class="top">
      <h1>御魂沙盒</h1>
      <span class="src" id="src"></span>
    </div>
    <p>离线自娱自乐版：6 星御魂随便买、随便强化，副属性按客户端里的随机规则出；召唤按客户端公示概率、阶段曲线和保底跑。存档只放在这个浏览器里。玩家自制的非官方工具，和网易无关。</p>
    <nav class="tabs" role="tablist" aria-label="页面">
      <button class="tab" role="tab" id="tab-yh" aria-controls="p-yh" aria-selected="true">御魂</button>
      <button class="tab" role="tab" id="tab-g" aria-controls="p-g" aria-selected="false">召唤</button>
      <button class="tab" role="tab" id="tab-rules" aria-controls="p-rules" aria-selected="false">规则</button>
    </nav>
  </header>

  <!-- ================= 御魂 ================= -->
  <section id="p-yh" role="tabpanel" aria-labelledby="tab-yh">
    <div class="tiles" id="yh-tiles"></div>
    <div class="yh-layout">
      <div class="yh-left">
        <div class="panel buy" id="buy">
          <div class="panel-h"><h2>买御魂</h2><span class="hint">不要钱，随便买</span></div>
          <div class="field"><span>套装</span><input type="search" class="setq" id="b-setq" placeholder="搜：名字、拼音首字母或效果，如 破势 / ps / 眩晕" autocomplete="off" spellcheck="false" aria-label="搜套装"><select id="b-set" aria-label="套装"></select><span class="hint setq-n" id="b-setq-n"></span></div>
          <div class="field"><span>位置</span><div class="seg" id="b-pos"></div></div>
          <label class="field"><span>主属性</span><select id="b-main"></select></label>
          <label class="field" id="b-fx-wrap" hidden><span>固有属性（只有首领御魂有）</span><select id="b-fx"></select></label>
          <div class="field"><span>品质</span><div class="seg" id="b-kind">
            <button type="button" data-v="0" aria-pressed="true">普通（初始 2~4 条）</button>
            <button type="button" data-v="1" aria-pressed="false">珍品（初始 4 条）</button>
          </div></div>
          <div class="field"><span>数量</span><div class="seg" id="b-num">
            <button type="button" data-v="1" aria-pressed="true">1</button>
            <button type="button" data-v="10" aria-pressed="false">10</button>
            <button type="button" data-v="100" aria-pressed="false">100</button>
            <button type="button" data-v="1000" aria-pressed="false">1000</button>
            <button type="button" data-v="10000" aria-pressed="false">1万</button>
          </div></div>
          <div class="field"><span>强化规则（副属性满 4 条后提升哪条）</span><div class="seg" id="b-rule">
            <button type="button" data-v="dyn" aria-pressed="true">按次数加权（默认）</button>
            <button type="button" data-v="flat" aria-pressed="false">各 1/4</button>
          </div><p class="hint" id="b-rule-note"></p></div>
          <label class="chk"><input type="checkbox" id="b-max"> 买完直接强化到 +15</label>
          <div class="go"><button class="btn primary" id="b-go" type="button">买</button><button class="btn" id="b-custom" type="button">自定义…</button></div>
        </div>
        <div class="panel" id="bench" aria-live="polite"></div>
      </div>

      <div class="panel" id="store">
        <div class="panel-h"><h2>仓库</h2><span class="hint" id="st-count"></span></div>
        <div class="records" id="records"></div>
        <div class="store-tools">
          <div class="field"><span>套装</span><input type="search" class="setq" id="f-setq" placeholder="搜套装" autocomplete="off" spellcheck="false" aria-label="搜套装"><select id="f-set" aria-label="按套装筛选"></select><span class="hint setq-n" id="f-setq-n"></span></div>
          <label class="field"><span>位置</span><select id="f-pos"></select></label>
          <label class="field"><span>主属性</span><select id="f-main"></select></label>
          <label class="field"><span>带这条副属性</span><select id="f-sub"></select></label>
          <label class="field"><span>等级</span><select id="f-lv">
            <option value="all">全部</option><option value="0">+0（没强化）</option><option value="mid">+1 ~ +14</option><option value="15">+15</option>
          </select></label>
          <label class="field"><span>副属性条数</span><select id="f-cnt">
            <option value="all">全部</option><option value="4">4 条（传说）</option><option value="3">3 条（极品）</option><option value="2">2 条（稀有）</option><option value="1">1 条（精品）</option><option value="0">没有副属性</option>
          </select></label>
          <label class="field"><span>固有属性（首领）</span><select id="f-fx"></select></label>
          <label class="field"><span>排序</span><select id="f-sort"></select></label>
        </div>
        <div class="store-meta">
          <label class="chk"><input type="checkbox" id="f-lock"> 只看锁定的</label>
          <div class="row" id="batch"></div>
        </div>
        <div class="selbar" id="selbar" hidden></div>
        <div class="grid" id="grid"></div>
        <div class="more" id="more"></div>
        <div class="savebar">
          <p class="hint"><span id="sv-mode">存档放在这个浏览器里。</span>清理浏览器数据或换设备会丢，想留着就导出一份。 <span id="sv-status" class="num"></span></p>
          <button class="btn small" id="sv-export" type="button">导出存档</button>
          <button class="btn small" id="sv-import" type="button">导入存档</button>
          <span id="sv-clear"></span>
        </div>
        <div class="importbox" id="importbox" hidden>
          <input type="file" id="imp-file" accept=".json,application/json">
          <span class="hint">或者把存档文本粘贴到下面：</span>
          <textarea id="imp-text" spellcheck="false"></textarea>
          <div class="row"><button class="btn small" id="imp-go" type="button">导入（会替换当前存档）</button><button class="btn small" id="imp-cancel" type="button">取消</button></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= 召唤 ================= -->
  <section id="p-g" role="tabpanel" aria-labelledby="tab-g" hidden>
    <div class="g-layout">
      <div class="panel g-main">
        <div class="panel-h"><h2 id="g-title">召唤</h2><span class="hint" id="g-sub"></span></div>
        <div class="seg" id="g-mode">
          <button type="button" data-v="sakuya" aria-pressed="true">咲耶 · 限时 UP</button>
          <button type="button" data-v="normal" aria-pressed="false">常驻召唤</button>
          <button type="button" data-v="ten" aria-pressed="false">十连十金</button>
        </div>
        <div class="g-opts" id="g-opts"></div>
        <div class="g-actions" id="g-actions"></div>
        <div class="g-status" id="g-status"></div>
        <div class="cards" id="g-cards"></div>
        <div class="sim" id="g-sim"></div>
      </div>
      <div class="g-side">
        <div class="panel"><div class="panel-h"><h2>出货记录</h2><span class="hint" id="g-hist-n"></span></div><ul class="hist" id="g-hist"></ul></div>
        <div class="panel"><div class="panel-h"><h2>图鉴</h2><span class="hint" id="g-coll-n"></span></div><div class="coll" id="g-coll"></div></div>
        <div class="panel" id="g-miles-box"><div class="panel-h"><h2>阶段奖励</h2><span class="hint">按累计召唤次数</span></div><ul class="miles" id="g-miles"></ul><div class="curvebox" id="g-curve"></div></div>
      </div>
    </div>
  </section>

  <!-- ================= 规则 ================= -->
  <section id="p-rules" role="tabpanel" aria-labelledby="tab-rules" hidden>
    <div class="rules" id="rules"></div>
  </section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="cdlg" class="cdlg" aria-label="自定义御魂"><div id="cdlg-body" class="cdlg-body"></div></dialog>
<dialog id="rdlg" class="cdlg rdlg" aria-label="批量强化统计"><div id="rdlg-body" class="cdlg-body"></div><div class="rtip" id="rp-tip" role="tooltip" hidden></div></dialog>

    hay: [s.n, s.two.map(([k]) => SK[k].name).join(' '), s.d2, s.d4, s.way, s.boss ? '首领御魂' : '常规御魂'].join(' ').toLowerCase(),
  }));
  return SET_IDX;
}
/** 返回匹配的套装（名字和拼音命中的排前面）；q 是空的返回 null */
function searchSets(q) {
  const toks = String(q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return null;
  const out = [];
  for (const e of setIndex()) {
    let score = 0, ok = true;
    for (const t of toks) {
      if (e.n.startsWith(t) || e.py.startsWith(t)) score += 0;
      else if (e.n.includes(t) || e.py.includes(t)) score += 1;
      else if (e.hay.includes(t)) score += 3;
      else { ok = false; break; }
    }
    if (ok) out.push([score, e.s]);
  }
  out.sort((a, b) => a[0] - b[0]);                  // 稳定排序：同分的保持表里的顺序
  return out.map((x) => x[1]);
}
/** 套装下拉框的选项。mode：buy 带两个「随机」，filter 带「全部套装」，plain 只有套装。q 有内容时只列匹配的 */
function setOptions(mode, q) {
  const opt = (v, t) => '<option value="' + esc(v) + '">' + esc(t) + '</option>';
  const hits = searchSets(q);
  if (hits) return { n: hits.length, first: hits.length ? String(hits[0].id) : null, html: hits.map((s) => opt(s.id, s.n + (s.boss ? '（首领）' : ''))).join('') };
  let h = '';
  if (mode === 'buy') h += opt('rand', '随机（常规御魂 ' + NORMAL_SETS.length + ' 种）') + opt('randall', '随机（含首领御魂，共 ' + D.sets.length + ' 种）');
  if (mode === 'filter') h += opt('all', '全部套装');
  h += '<optgroup label="常规御魂">' + NORMAL_SETS.map((s) => opt(s.id, s.n)).join('') + '</optgroup>' +
    '<optgroup label="首领御魂（只有 2 件套）">' + D.sets.filter((s) => s.boss).map((s) => opt(s.id, s.n)).join('') + '</optgroup>';
  return { n: -1, first: null, html: h };
}
/** 搜索框配下拉框：打字时下拉框只留匹配的套装并选中第一个；没有匹配的就保留原来的列表；清空恢复完整列表。
    中文输入法拼字的过程中不处理，等选好字再搜 */
function wireSetSearch(qEl, selEl, noteEl, mode, getCur, pick) {
  const apply = () => {
    const q = qEl.value, r = setOptions(mode, q);
    if (r.n === 0) { noteEl.textContent = '没有匹配「' + q.trim() + '」的套装'; noteEl.classList.add('bad'); return; }
    noteEl.classList.remove('bad');
    selEl.innerHTML = r.html;
    if (r.first) {
      noteEl.textContent = '匹配 ' + r.n + ' 套' + (r.n > 1 ? '，在下拉框里换' : '');
      selEl.value = r.first; if (getCur() !== r.first) pick(r.first);
    } else {
      noteEl.textContent = '';
      selEl.value = getCur(); if (!selEl.value) selEl.selectedIndex = 0;
    }
  };
  qEl.addEventListener('input', (e) => { if (!e.isComposing) apply(); });
  qEl.addEventListener('compositionend', apply);
  qEl.addEventListener('keydown', (e) => { if (e.key === 'Escape' && qEl.value) { e.preventDefault(); qEl.value = ''; apply(); } });
  return apply;
}

/** 两步确认：第一次点出现「确定」 */
function twoStep(holder, label, sure, fn) {

/* ======================= 御魂：自定义 =======================
   套装、位置、主属性、初始副属性（属性和数值）、每一级强化命中哪条都可以指定；留「随机」的按游戏规则随机。
   指定的结果必须合乎规则：不足 4 条才能新增，满 4 条只能提升已有的；数值在单位值的 0.8~1.0 倍之间。 */
const ENH_LIST = D.enhLevels;
const CUST_NS = [1, 10, 100, 1000, 10000];        // 创建数量的快捷档；也可以在旁边的框里填任意件数
let custNBad = false;                             // 数量框里现在填的不是正整数（按钮先灰掉，失焦时恢复成上一次填对的）
const dispMul = (k) => (SK[k].pct ? 100 : 1);           // 输入框里百分比属性按「%」填
const trimNum = (v) => String(+v.toFixed(4));
function valRange(k, enh) { const r = enh ? D.enhCoef : D.coef, u = SK[k].unit * dispMul(k); return [r[0] * u, r[1] * u]; }
function rangeText(k, enh) { const [a, b] = valRange(k, enh), f = (x) => String(+x.toFixed(2)); return f(a) + '~' + f(b) + (SK[k].pct ? '%' : ''); }
/** 输入的数值 → 系数×10000；超出范围返回 null */
function coefFromVal(k, v, enh) {
  const r = enh ? D.enhCoef : D.coef, c = v / (SK[k].unit * dispMul(k));
  if (!isFinite(c) || c < r[0] - 1e-6 || c > r[1] + 1e-6) return null;
  return Math.round(Math.min(r[1], Math.max(r[0], c)) * C10K);
}
/** 系数 → 输入框里显示的数值：取最短的、换回去还是同一个系数的写法（填 2.9 存成系数 0.9667，再显示还是 2.9） */
function valFromCoef(k, ci) {
  const u = SK[k].unit * dispMul(k);
  for (let d = 0; d <= 4; d++) { const s = (ci / C10K * u).toFixed(d); if (Math.round(+s / u * C10K) === ci) return String(+s); }
  return trimNum(ci / C10K * u);
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function withSeed(seed, fn) { const prev = RNG; RNG = mulberry32(seed); try { return fn(); } finally { RNG = prev; } }

const slot = (k, v) => ({ k: k == null ? 'rand' : k, v: v == null ? '' : String(v) });
function custDefault() {
  const set = SETS[300030] ? 300030 : NORMAL_SETS[0].id;
  return { set: String(set), pos: 2, main: 'spd', fx: '', lv: 0, zp: false, n: 1,
    init: [slot(), slot(), slot(), slot()], steps: ENH_LIST.map(() => slot()) };
}
/** 每一级强化之前这件御魂有哪几条（前面有随机的、条数又不满 4 条时就不知道了） */
function custStates(sp) {
  let known = sp.init.every((s) => s.k !== 'rand');
  const have = known ? sp.init.filter((s) => s.k).map((s) => s.k) : null;
  const out = [];
  ENH_LIST.forEach((lv, j) => {
    if (lv > sp.lv) return;
    out.push({ lv, j, known, have: known ? have.slice() : null });
    const st = sp.steps[j];
    if (!known) return;
    if (st.k !== 'rand') { if (!have.includes(st.k)) have.push(st.k); }
    else if (have.length < 4) known = false;          // 满 4 条时随机也只是在这 4 条里，条目不变
  });
  return out;
}
/** 把说明书整理成合法的：位置/主属性/固有属性对得上，初始副属性不重复，指定的强化结果合乎规则 */
function custNormalize(sp) {
  const d = custDefault();
  sp = Object.assign(d, sp || {});
  if (!SETS[+sp.set]) sp.set = d.set;
  sp.pos = Math.min(6, Math.max(1, +sp.pos || 2));
  const cands = D.mains[sp.pos];
  if (sp.main && !cands.some((c) => c.k === sp.main)) sp.main = '';
  if (cands.length === 1) sp.main = cands[0].k;

function recScan(items, best) {

    const sb = y.sb;

    for (let j = 0; j < n; j++) if (cnts[j] && (!best[j] || sums[j] > best[j].v)) best[j] = { v: sums[j], id: y.id, n: cnts[j] };

}

/* ======================= 召唤的统计（画像） =======================
   统计当前这一项（咲耶 UP / 常驻 / 十连十金）从「重新开始」以来的全部召唤，「实际」用存档里的计数和出货记录（最近 3000 个 SSR/SP/UR）算。

   · 欧气、各稀有度：被保底强制的那几抽一定出货，不算运气；其余每抽按公示概率（SSR/SP 1.25%）算期望和二项分布；
   · 出货间隔、60 抽必出次数：按每个间隔的理论分布（每抽 1.25%，咲耶池第 60 抽必出）乘以实际的间隔个数；
   · 图鉴：按实际抽到的 SSR、SP 个数，算同一卡池里平均会有几位不同的；
   · 咲耶第几抽出：按规则精确递推；最长没出、十连十金的图鉴：按同样的选项从头模拟（分段算，不卡页面）。 */
const isGift = (tg) => / 抽赠礼/.test(tg || '');

const pSSTxt = () => +(G.rates.SSR + G.rates.SP).toFixed(2) + '%';
/** 咲耶第几抽出的精确分布：pt[t] = 正好第 t 抽出咲耶的概率（状态 = 已经连续几抽没出 SSR/SP） */
const SK_DIST = {};

  const key = full ? '1' : '2';
  if (SK_DIST[key]) return SK_DIST[key];
  const floorN = SAKUYA.floor[key], P = SAKUYA.pity, p = pSS();
  let f = new Float64Array(P); f[0] = 1;
  const pt = new Float64Array(floorN + 1);

    if (n + 1 === floorN) { let m = 0; for (let j = 0; j < P; j++) m += f[j]; pt[floorN] = m; break; }

      const ps = j >= P - 1 ? 1 : p;                 // 连续 59 抽没出，第 60 抽必出
      pt[n + 1] += m * ps * u;

  const q = (x) => { for (let t = 1; t <= floorN; t++) if (cdf[t] >= x - 1e-12) return t; return floorN; };
  return (SK_DIST[key] = { floorN, pt, cdf, mean, q50: q(0.5), q90: q(0.9), q99: q(0.99) });

/** SSR/SP 出货间隔的分组和每组的理论概率：每抽 1.25%，咲耶池第 60 抽必出，常驻没有保底 */
function gapBins(mode) {
  const p = pSS(), q = 1 - p, P = SAKUYA.pity;

    return { edges, cats, probs, tips: cats.map((c, i) => (i === cats.length - 1 ? '第 ' + P + ' 抽（必出）' : '隔 ' + c.replace('–', '～') + ' 抽出')) };

function openGRep() {
  const mode = S.g.mode, st = gState(); if (!st.n) return;
  const dlg = $('gdlg'), key = gKey(mode, st);
  renderGRep();
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  dlg.scrollTop = 0;
  if (mode === 'sakuya' || gTheory.key === key) return;    // 咲耶池的理论都是直接算的，不用模拟
  if (gTheory.job) gTheory.job.cancelled = true;
  gTheory = { key, data: null, job: null };
  setTimeout(() => {
    if (gTheory.key !== key) return;
    gTheory.job = gSimulate(mode, st, (T) => {
      if (gTheory.key !== key) return;
      gTheory.data = T; gTheory.job = null;
      if (dlg.open && gKey(S.g.mode, gState()) === key) { const sc = dlg.scrollTop; renderGRep(); dlg.scrollTop = sc; }

  }, 30);
}
